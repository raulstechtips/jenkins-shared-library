project-config:
  project-name: secrets-manager
  project-description: Infisical fork built from upstream release tags
  publish-targets:
    - ghcr
  docker-image:
    name: secrets-manager
    dockerfile: Dockerfile.standalone-infisical
    context: .
    build-args:
      - INFISICAL_PLATFORM_VERSION=${VERSION}
      - DD_GIT_COMMIT_SHA=${GIT_COMMIT}
      - DD_GIT_REPOSITORY_URL=${GIT_URL}
  pipeline-steps:
    trivy-scan: true
    build-docker-image: true
